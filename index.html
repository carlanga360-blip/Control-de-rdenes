<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3a8f34" />
    <meta name="description" content="Levantamiento de Infraestructuras e Inventario de Cableras — emulación web del formulario Survey123 Infocomunicaciones." />
    <title>Infocomunicaciones · Inventario de Cableras</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="appbar">
        <button id="btnClose" class="icon-btn" type="button" title="Cerrar formulario"></button>
        <h1 id="appTitle">Infocomunicaciones</h1>
        <span id="gpsStatus" class="gps-indicator" title="GPS"></span>
        <button id="btnMenu" class="icon-btn" type="button" title="Menú"></button>
      </header>

      <div id="menuBackdrop" class="menu-backdrop hidden"></div>
      <nav id="menu" class="menu hidden" aria-label="Menú">
        <div class="menu-section">Formulario</div>
        <button data-action="nuevo">Nuevo levantamiento</button>
        <button data-action="borrador">Guardar como borrador</button>
        <button data-action="bandeja">Bandeja de registros</button>
        <div class="menu-section">Jefaturas</div>
        <button data-action="tablero">Tablero de seguimiento</button>
        <button data-action="csv">Exportar CSV (postes y cableras)</button>
        <button data-action="geojson">Exportar GeoJSON (GIS)</button>
        <button data-action="respaldo">Respaldo completo (JSON con fotos)</button>
        <button data-action="importar">Importar respaldo…</button>
        <div class="menu-section">Demostración</div>
        <button data-action="demo">Cargar datos de demostración</button>
        <button data-action="limpiarDemo">Eliminar datos de demostración</button>
        <button data-action="acerca">Acerca de</button>
      </nav>

      <main>
        <section id="view-form" class="view"></section>
        <section id="view-inbox" class="view page hidden"></section>
        <section id="view-dash" class="view page hidden"></section>
      </main>

      <footer id="formbar" class="formbar">
        <div class="progress"><div id="progressFill" class="progress-fill"></div></div>
        <div class="formbar-row">
          <span id="progressText" class="muted"></span>
          <button id="btnSubmit" class="submit-btn" type="button" title="Enviar levantamiento"></button>
        </div>
      </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/widgets.js"></script>
    <script src="js/form.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
